# Logstash Pipeline for RASP Logs
# Parses OpenRASP JSON logs and forwards to Elasticsearch

input {
  # Syslog input (from OpenRASP syslog forwarding)
  udp {
    port => 5140
    type => "rasp-syslog"
    codec => "json"
  }

  # File input (for testing with sample logs)
  file {
    path => "/var/log/rasp/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "rasp-file"
    codec => "json_lines"
  }

  # HTTP input (for webhook forwarding)
  http {
    port => 8080
    type => "rasp-webhook"
  }
}

filter {
  # Parse RASP log fields
  if [type] == "rasp-syslog" or [type] == "rasp-file" or [type] == "rasp-webhook" {
    # Ensure timestamp is parsed
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Add RASP-specific fields
    mutate {
      add_field => {
        "rasp_agent" => "%{[rasp_agent]}"
        "attack_type" => "%{[attack_type]}"
        "action_taken" => "%{[action]}"
        "client_ip" => "%{[client_ip]}"
        "request_url" => "%{[request_url]}"
        "plugin_name" => "%{[plugin_name]}"
        "request_id" => "%{[request_id]}"
      }
    }

    # GeoIP enrichment (optional - requires GeoIP database)
    # geoip {
    #   source => "client_ip"
    #   target => "geoip"
    #   database => "/usr/share/logstash/GeoLite2-City.mmdb"
    # }

    # Categorize attack severity
    mutate {
      add_field => {
        "attack_severity" => "medium"
      }
    }

    # High severity attacks
    if [attack_type] in ["sqli", "cmdi", "rce", "deserialization", "xxe"] {
      mutate {
        update => { "attack_severity" => "high" }
      }
    }

    # Critical attacks (successful exploitation indicators)
    if [action] == "block" and [attack_type] in ["sqli", "cmdi", "rce", "deserialization"] {
      mutate {
        update => { "attack_severity" => "critical" }
      }
    }

    # Parse stack trace for component identification
    if [stack_trace] {
      grok {
        match => { "stack_trace" => "%{JAVACLASS:java_class}\.%{WORD:java_method}\(%{JAVAFILE:java_file}:%{NUMBER:java_line}\)" }
        overwrite => ["stack_trace"]
      }
    }

    # Parse attack parameters for IOC extraction
    if [attack_params] {
      # Flatten attack_params for easier querying
      ruby {
        code => "
          if event.get('attack_params').is_a?(Hash)
            event.get('attack_params').each do |k, v|
              event.set(\"attack_param_#{k}\", v)
            end
          end
        "
      }
    }
  }
}

output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "rasp-logs-%{+YYYY.MM.dd}"
    template_name => "rasp-template"
    template => "/usr/share/logstash/templates/rasp-template.json"
    template_overwrite => true
  }

  # Stdout for debugging
  stdout {
    codec => rubydebug
  }
}